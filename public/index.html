<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>聊天室</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --panel-3: #232833;
    --border: #272c37; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #4f8cff; --accent-soft: #4f8cff22;
    --ok: #3ddc97; --warn: #ffb020; --danger: #ff5c5c; --purple: #a78bfa;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 4px; }

  .hidden { display: none !important; }

  /* ---------- 认证层 ---------- */
  #auth {
    position: fixed; inset: 0; z-index: 50; display: flex;
    align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2333 0%, var(--bg) 60%);
    overflow-y: auto; padding: 24px;
  }
  .card {
    width: min(94vw, 420px); background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px; padding: 28px;
    box-shadow: 0 24px 60px #0008;
  }
  .card h1 { margin: 0 0 6px; font-size: 22px; }
  .card p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; background: var(--panel-2);
          padding: 4px; border-radius: var(--radius); }
  .tabs button {
    flex: 1; padding: 9px; background: transparent; border: 0;
    border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 600;
  }
  .tabs button.on { background: var(--accent); color: #fff; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .input {
    width: 100%; padding: 11px 13px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: var(--radius); outline: none;
    transition: border-color .15s;
  }
  .input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 12px; background: var(--accent); color: #fff;
    border: 0; border-radius: var(--radius); font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: var(--panel-2); border: 1px solid var(--border); }
  .btn.ghost:hover { border-color: var(--accent); }
  .btn.danger { background: var(--danger); }
  .btn.sm { width: auto; padding: 5px 12px; font-size: 12px; border-radius: 7px; }
  .msg-box {
    padding: 10px 13px; border-radius: var(--radius); font-size: 13px;
    margin-bottom: 15px; display: none; line-height: 1.45;
  }
  .msg-box.on { display: block; }
  .msg-box.err { background: #ff5c5c1a; border: 1px solid #ff5c5c55; color: #ffb3b3; }
  .msg-box.ok { background: #3ddc971a; border: 1px solid #3ddc9755; color: #a8f0cf; }
  .msg-box.info { background: #4f8cff1a; border: 1px solid #4f8cff55; color: #bcd6ff; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 14px; text-align: center; line-height: 1.6; }

  /* ---------- 主界面 ---------- */
  #app { display: none; height: 100%; grid-template-columns: 250px 1fr; }
  #app.on { display: grid; }
  aside { background: var(--panel); border-right: 1px solid var(--border);
          display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 15px 16px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 9px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; }
  .brand .dot.off { background: var(--danger); }
  .brand b { font-size: 15px; flex: 1; }
  .side-scroll { flex: 1; overflow-y: auto; padding: 14px; min-height: 0; }
  .side-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
                color: var(--muted); margin: 4px 0 9px; display: flex;
                justify-content: space-between; align-items: center; }
  .room { display: flex; align-items: center; justify-content: space-between;
          padding: 9px 11px; border-radius: var(--radius); cursor: pointer;
          margin-bottom: 3px; color: var(--muted); transition: background .13s, color .13s; }
  .room:hover { background: var(--panel-2); color: var(--text); }
  .room.on { background: var(--accent-soft); color: #cfe0ff; font-weight: 600; }
  .room .cnt { font-size: 11px; background: var(--panel-2); padding: 1px 7px;
               border-radius: 999px; }
  .room.on .cnt { background: #ffffff1a; }
  .lock { font-size: 11px; opacity: .7; }
  .user { display: flex; align-items: center; gap: 9px; padding: 6px 4px; font-size: 13px; }
  .av { width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
        display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 700; margin-left: auto; }
  .badge.admin { background: #a78bfa2a; color: var(--purple); }
  .badge.mod { background: #ffb0202a; color: var(--warn); }
  .me-tag { font-size: 11px; color: var(--muted); margin-left: auto; }
  .side-foot { padding: 12px; border-top: 1px solid var(--border); }
  .whoami { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; font-size: 13px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { padding: 13px 20px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 12px; background: var(--panel); }
  header h2 { margin: 0; font-size: 15px; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  .hbtn { background: var(--panel-2); border: 1px solid var(--border);
          padding: 6px 13px; border-radius: 7px; cursor: pointer; font-size: 12px; }
  .hbtn:hover { border-color: var(--accent); }

  #announce {
    display: none; padding: 10px 20px; background: #ffb02014;
    border-bottom: 1px solid #ffb02033; font-size: 13px; color: #ffd591;
  }
  #announce.on { display: block; }

  #feed { flex: 1; overflow-y: auto; padding: 20px; min-height: 0; }
  .sys { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0; }
  .sys span { background: var(--panel-2); padding: 3px 12px; border-radius: 999px; }

  .msg { display: flex; gap: 10px; margin-bottom: 16px; }
  .msg.self { flex-direction: row-reverse; }
  .msg .body { max-width: min(680px, 72%); }
  .msg .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;
              font-size: 12px; color: var(--muted); }
  .msg.self .top { flex-direction: row-reverse; }
  .msg .top b { color: var(--text); font-size: 13px; font-weight: 600; }
  .bubble { background: var(--panel-2); border: 1px solid var(--border);
            padding: 9px 13px; border-radius: 3px 12px 12px 12px;
            white-space: pre-wrap; word-break: break-word; }
  .msg.self .bubble { background: var(--accent); border-color: var(--accent);
                      color: #fff; border-radius: 12px 3px 12px 12px; }
  .msg.recalled .bubble { background: transparent; border-style: dashed;
                          color: var(--muted); font-style: italic; font-size: 13px; }
  .acts { display: flex; gap: 4px; margin-top: 5px; opacity: 0; transition: opacity .15s; }
  .msg:hover .acts { opacity: 1; }
  .msg.self .acts { justify-content: flex-end; }
  .act { font-size: 11px; background: var(--panel-2); border: 1px solid var(--border);
         color: var(--muted); padding: 2px 8px; border-radius: 6px; cursor: pointer; }
  .act:hover { color: var(--text); border-color: var(--accent); }
  .act.del:hover { color: var(--danger); border-color: var(--danger); }

  #typing { height: 20px; padding: 0 20px 4px; font-size: 12px;
            color: var(--muted); font-style: italic; }
  #muteBar { display: none; padding: 10px 20px; background: #ff5c5c14;
             border-top: 1px solid #ff5c5c33; font-size: 13px; color: #ffb3b3; }
  #muteBar.on { display: block; }

  footer { border-top: 1px solid var(--border); padding: 14px 20px; background: var(--panel); }
  .composer { display: flex; gap: 10px; align-items: flex-end; }
  #input { flex: 1; resize: none; max-height: 150px; padding: 11px 13px;
           line-height: 1.5; background: var(--panel-2); border: 1px solid var(--border);
           border-radius: var(--radius); outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { padding: 11px 22px; background: var(--accent); color: #fff; border: 0;
          border-radius: var(--radius); font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 7px; }
  kbd { background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 4px; padding: 1px 5px; font-size: 10px; font-family: inherit; }

  /* ---------- 通用弹层 ---------- */
  .overlay { position: fixed; inset: 0; background: #000a; z-index: 100;
             display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: var(--panel); border: 1px solid var(--border);
           border-radius: 14px; width: min(94vw, 900px); max-height: 88vh;
           display: flex; flex-direction: column; overflow: hidden; }
  .modal.narrow { width: min(94vw, 460px); }
  .modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border);
                display: flex; align-items: center; gap: 14px; }
  .modal-head h3 { margin: 0; font-size: 16px; flex: 1; }
  .close { background: none; border: 0; color: var(--muted); font-size: 22px;
           cursor: pointer; line-height: 1; padding: 0 4px; }
  .close:hover { color: var(--text); }
  .mtabs { display: flex; gap: 4px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .mtabs button { background: none; border: 0; padding: 9px 14px; cursor: pointer;
                  color: var(--muted); border-bottom: 2px solid transparent;
                  font-weight: 600; font-size: 13px; }
  .mtabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .mtabs button .pill { background: var(--danger); color: #fff; font-size: 10px;
                        border-radius: 999px; padding: 1px 6px; margin-left: 5px; }
  .modal-body { padding: 18px 20px; overflow-y: auto; flex: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase;
       letter-spacing: .06em; color: var(--muted); padding: 8px 10px;
       border-bottom: 1px solid var(--border); font-weight: 600; }
  td { padding: 10px; border-bottom: 1px solid #20242d; vertical-align: middle; }
  tr:hover td { background: #ffffff05; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .tag.active { background: #3ddc9722; color: var(--ok); }
  .tag.pending { background: #ffb02022; color: var(--warn); }
  .tag.banned { background: #ff5c5c22; color: var(--danger); }
  .tag.admin { background: #a78bfa22; color: var(--purple); }
  .tag.mod { background: #ffb02022; color: var(--warn); }
  .tag.user { background: #4f8cff22; color: var(--accent); }
  .tag.open { background: #ff5c5c22; color: var(--danger); }
  .tag.resolved { background: #3ddc9722; color: var(--ok); }
  .tag.dismissed { background: #8b93a722; color: var(--muted); }
  .row-acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }
  .bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

  /* ---------- 侧栏 Tab ---------- */
  .tabs-mini { display: flex; gap: 5px; background: var(--panel-2); padding: 4px;
               border-radius: var(--radius); margin-bottom: 14px; }
  .tabs-mini button { flex: 1; padding: 7px; background: transparent; border: 0;
                      border-radius: 7px; cursor: pointer; color: var(--muted);
                      font-weight: 600; font-size: 13px; position: relative; }
  .tabs-mini button.on { background: var(--accent); color: #fff; }
  .dot-badge { display: none; position: absolute; top: 2px; right: 8px;
               min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
               background: var(--danger); color: #fff; font-size: 10px;
               line-height: 16px; font-weight: 700; }
  .dot-badge.on { display: inline-block; }
  .dm-search { font-size: 13px; padding: 8px 10px; margin-bottom: 8px; }

  /* 会话条目 */
  .conv { display: flex; align-items: center; gap: 9px; padding: 9px 10px;
          border-radius: var(--radius); cursor: pointer; margin-bottom: 2px;
          transition: background .13s; }
  .conv:hover { background: var(--panel-2); }
  .conv.on { background: var(--accent-soft); }
  .conv .info { flex: 1; min-width: 0; }
  .conv .nm { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .conv .pv { font-size: 11px; color: var(--muted); white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .conv .unread { background: var(--danger); color: #fff; font-size: 10px;
                  min-width: 17px; height: 17px; line-height: 17px; text-align: center;
                  border-radius: 999px; padding: 0 5px; font-weight: 700; flex: 0 0 auto; }
  .online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .online-dot.on { background: var(--ok); }

  /* 附件 */
  .upload-bar { font-size: 12px; color: var(--muted); margin-top: 6px; display: none; }
  .upload-bar.on { display: block; }
  .attach-card { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
                 background: var(--panel-2); border: 1px solid var(--border);
                 border-radius: var(--radius); margin-top: 6px; max-width: 320px; }
  .msg.self .attach-card { background: #ffffff1a; border-color: #ffffff33; }
  .attach-card .ico { font-size: 20px; }
  .attach-card .meta2 { min-width: 0; }
  .attach-card .nm2 { font-size: 13px; word-break: break-all; }
  .attach-card .sz { font-size: 11px; color: var(--muted); }
  .msg.self .attach-card .sz { color: #ffffffaa; }
  .attach-img { max-width: 260px; max-height: 260px; border-radius: 8px;
                display: block; cursor: pointer; }
  .read-tag { font-size: 10px; color: var(--muted); }
  .read-tag.read { color: var(--ok); }

  /* 会话操作菜单 */
  .menu { position: absolute; background: var(--panel-3); border: 1px solid var(--border);
          border-radius: 9px; padding: 5px; z-index: 120; box-shadow: 0 12px 30px #0009;
          min-width: 150px; }
  .menu button { display: block; width: 100%; text-align: left; background: none;
                 border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer;
                 font-size: 13px; color: var(--text); }
  .menu button:hover { background: var(--panel-2); }
  .menu button.danger { color: #ffb3b3; }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; }
    aside { display: none; }
  }
</style>
</head>
<body>

<!-- ================= 登录 / 注册 ================= -->
<div id="auth">
  <div class="card">
    <h1 id="authTitle">登录聊天室</h1>
    <p class="sub" id="authSub">输入账号密码继续</p>

    <div class="tabs">
      <button id="tabLogin" class="on">登录</button>
      <button id="tabReg">注册</button>
    </div>

    <div class="msg-box" id="authMsg"></div>

    <div class="field">
      <label for="aUser">用户名</label>
      <input id="aUser" class="input" maxlength="20" autocomplete="username" />
    </div>
    <div class="field">
      <label for="aPass">密码</label>
      <input id="aPass" class="input" type="password" autocomplete="current-password" />
    </div>
    <div class="field hidden" id="pass2Field">
      <label for="aPass2">确认密码</label>
      <input id="aPass2" class="input" type="password" autocomplete="new-password" />
    </div>

    <button class="btn" id="authSubmit">登录</button>
    <p class="tip" id="authTip"></p>
  </div>
</div>

<!-- ================= 主界面 ================= -->
<div id="app">
  <aside>
    <div class="brand">
      <span class="dot" id="dot"></span>
      <b>聊天室</b>
    </div>
    <div class="side-scroll">
      <div class="tabs-mini">
        <button id="tabRooms" class="on">房间</button>
        <button id="tabDms">私聊<span class="dot-badge" id="dmBadge"></span></button>
      </div>

      <div id="paneRooms">
        <div class="side-title">
          <span>房间列表</span>
          <span id="newRoomBtn" style="cursor:pointer;display:none">+ 新建</span>
        </div>
        <div id="roomlist"></div>
        <div class="side-title" style="margin-top:20px">
          <span>在线成员</span><span id="onlineCnt">0</span>
        </div>
        <div id="userlist"></div>
      </div>

      <div id="paneDms" class="hidden">
        <div class="side-title">
          <span>会话</span>
          <span id="newDmBtn" style="cursor:pointer">+ 发起</span>
        </div>
        <input id="dmSearch" class="input dm-search" placeholder="搜索会话或消息…" />
        <div id="convlist"></div>
        <div class="side-title" style="margin-top:18px">
          <span>黑名单</span>
        </div>
        <div id="blocklist"></div>
      </div>
    </div>
    <div class="side-foot">
      <div class="whoami">
        <div class="av" id="myAv"></div>
        <span id="myName"></span>
        <span id="myRole"></span>
      </div>
      <div style="display:flex;gap:6px">
        <button class="hbtn" id="adminBtn" style="flex:1;display:none">管理后台</button>
        <button class="hbtn" id="logoutBtn" style="flex:1">退出</button>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <h2 id="roomTitle">—</h2>
      <span id="dmPeerState" class="meta" style="display:none"></span>
      <button class="hbtn" id="peerMenuBtn" style="display:none">⋯</button>
      <span class="meta" id="connState">连接中…</span>
    </header>

    <div id="announce"></div>
    <div id="feed"></div>
    <div id="typing"></div>
    <div id="muteBar"></div>

    <footer>
      <div class="composer">
        <button class="hbtn" id="attachBtn" title="发送文件">📎</button>
        <input type="file" id="fileInput" class="hidden" />
        <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
        <button id="send">发送</button>
      </div>
      <div class="hint" id="composerHint">
        <kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行 · 悬停消息可撤回或举报
      </div>
      <div id="uploadBar" class="upload-bar"></div>
    </footer>
  </main>
</div>

<!-- 建房间弹层 -->
<div class="overlay hidden" id="roomModal">
  <div class="modal narrow">
    <div class="modal-head"><h3>新建房间</h3><button class="close" data-close>×</button></div>
    <div class="modal-body">
      <div class="msg-box" id="roomMsg"></div>
      <div class="field">
        <label>房间名称</label>
        <input id="rName" class="input" maxlength="24" placeholder="例如：项目讨论" />
      </div>
      <div class="field">
        <label>房间类型</label>
        <select id="rType" class="input">
          <option value="public">公开 —— 所有登录用户可见可进</option>
          <option value="private">私有 —— 仅管理员添加的成员可进</option>
        </select>
      </div>
      <button class="btn" id="rCreate">创建</button>
    </div>
  </div>
</div>

<!-- 举报弹层 -->
<div class="overlay hidden" id="reportModal">
  <div class="modal narrow">
    <div class="modal-head"><h3 id="reportTitle">举报消息</h3><button class="close" data-close>×</button></div>
    <div class="modal-body">
      <div class="msg-box" id="reportMsg"></div>
      <div class="field">
        <label>举报原因</label>
        <textarea id="rpReason" class="input" rows="4" maxlength="500"
                  placeholder="请说明该消息违反了哪条规则…"></textarea>
      </div>
      <button class="btn danger" id="rpSubmit">提交举报</button>
    </div>
  </div>
</div>

<!-- 发起私聊弹层 -->
<div class="overlay hidden" id="pickUserModal">
  <div class="modal narrow">
    <div class="modal-head"><h3>发起私聊</h3><button class="close" data-close>×</button></div>
    <div class="modal-body">
      <div class="msg-box" id="pickMsg"></div>
      <input id="pickSearch" class="input" placeholder="搜索用户名…" style="margin-bottom:12px" />
      <div id="pickList"></div>
    </div>
  </div>
</div>

<!-- ================= 管理后台 ================= -->
<div class="overlay hidden" id="adminModal">
  <div class="modal">
    <div class="modal-head">
      <h3>管理后台</h3>
      <button class="close" data-close>×</button>
    </div>
    <div class="mtabs" id="admTabs">
      <button data-tab="users" class="on">用户管理</button>
      <button data-tab="approve" id="tabApprove">待审批</button>
      <button data-tab="rooms">房间管理</button>
      <button data-tab="messages">消息管理</button>
      <button data-tab="dms" id="tabDms">私聊审计</button>
      <button data-tab="reports" id="tabReports">举报处理</button>
      <button data-tab="audit">审计日志</button>
    </div>
    <div class="modal-body" id="admBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const el = {
    auth: $('auth'), app: $('app'), authTitle: $('authTitle'), authSub: $('authSub'),
    tabLogin: $('tabLogin'), tabReg: $('tabReg'), aUser: $('aUser'), aPass: $('aPass'),
    aPass2: $('aPass2'), pass2Field: $('pass2Field'), authSubmit: $('authSubmit'),
    authMsg: $('authMsg'), authTip: $('authTip'),
    feed: $('feed'), input: $('input'), send: $('send'), typing: $('typing'),
    roomlist: $('roomlist'), userlist: $('userlist'), roomTitle: $('roomTitle'),
    onlineCnt: $('onlineCnt'), connState: $('connState'), dot: $('dot'),
    myAv: $('myAv'), myName: $('myName'), myRole: $('myRole'),
    adminBtn: $('adminBtn'), logoutBtn: $('logoutBtn'), newRoomBtn: $('newRoomBtn'),
    announce: $('announce'), muteBar: $('muteBar'),
    adminModal: $('adminModal'), admBody: $('admBody'), admTabs: $('admTabs'),
    roomModal: $('roomModal'), reportModal: $('reportModal'),
    tabRooms: $('tabRooms'), tabDms: $('tabDms'), paneRooms: $('paneRooms'),
    paneDms: $('paneDms'), convlist: $('convlist'), dmSearch: $('dmSearch'),
    dmBadge: $('dmBadge'), newDmBtn: $('newDmBtn'), blocklist: $('blocklist'),
    dmPeerState: $('dmPeerState'), peerMenuBtn: $('peerMenuBtn'),
    attachBtn: $('attachBtn'), fileInput: $('fileInput'), uploadBar: $('uploadBar'),
    composerHint: $('composerHint'),
    pickUserModal: $('pickUserModal'), pickSearch: $('pickSearch'),
    pickList: $('pickList'), pickMsg: $('pickMsg'),
  };

  // ---------- Supabase 客户端 ----------
  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  // ---------- 权限模型（与前后端一致）----------
  const PERMISSIONS = {
    'chat.send':'user','chat.report':'user','dm.send':'user','dm.block':'user',
    'room.create':'mod','chat.delete.any':'mod','chat.recall.any':'mod','user.mute':'mod',
    'chat.announce':'mod','report.handle':'mod','user.manage':'admin','user.approve':'admin',
    'room.manage':'admin','audit.view':'admin','dm.view':'admin'
  };
  const ROLE_LEVEL = { user:1, mod:2, admin:3 };
  const rolePerms = (role) => Object.entries(PERMISSIONS)
    .filter(([p,r]) => (ROLE_LEVEL[role]||0) >= ROLE_LEVEL[r]).map(([p])=>p);
  let me = null, perms = [];
  const can = (p) => perms.includes(p);

  // ---------- 常量/工具 ----------
  const PALETTE = ['#4f8cff','#3ddc97','#ff9f43','#ff6b9d','#a78bfa','#22d3ee','#f7b731','#ff5c5c'];
  const colorOf = (n) => { let h=0; for (let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return PALETTE[h%PALETTE.length]; };
  const initial = (n) => (n||'?').trim().charAt(0).toUpperCase();
  const timeOf = (ts) => new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const fullTime = (ts) => new Date(ts).toLocaleString('zh-CN',{hour12:false});
  const el2 = (tag, cls, text) => { const d=document.createElement(tag); if(cls) d.className=cls; if(text!=null) d.textContent=text; return d; };
  const ROLE_LABEL = { admin:'管理员', mod:'版主', user:'普通用户' };

  function showBox(node, text, kind){ node.textContent=text; node.className='msg-box on '+(kind||'info'); }
  const hideBox = (node) => { node.className='msg-box'; };

  // ---------- 状态 ----------
  let rooms=[], roomId=null, muteUntil=0;
  let typingTimer=null, lastTypingSent=0;
  const typingPeers=new Map();
  let replyTarget=null, admTab='users';
  let mode='room', convs=[], convKey=null, peer=null, peerOnline=false, peerBlocked=false, peerBlockedMe=false, blocks=[], unreadTotal=0;
  let dmTypingTimer=null; const dmTypingPeers=new Map(); let dmSearchTimer=null;
  const onlinePeers=new Set();
  let roomCh=null, dmCh=null, presenceUsers=[];

  // 私聊发送通道：Supabase 只有在 channel 已 subscribe(join) 后广播才能送达，
  // 因此每个对端维护一个已订阅的发送通道，并在打开会话时提前订阅。
  const dmSendCh = new Map();
  function dmChTo(userId){
    if(!dmSendCh.has(userId)){
      const ch = sb.channel('dm:'+userId);
      dmSendCh.set(userId, ch);
      ch.subscribe();
    }
    return dmSendCh.get(userId);
  }

  // 字段归一化：Supabase snake_case → 前端 camelCase
  const normMsg = (m) => ({ id:m.id, userId:m.user_id, nick:m.nick, text:m.text, ts:m.ts, recalled:m.recalled, recalledBy:m.recalled_by });
  const normDm = (m) => ({
    id:m.id, convKey:m.conv_key, fromId:m.from_id, toId:m.to_id, nick:m.nick, text:m.text, ts:m.ts,
    recalled:m.recalled, recalledBy:m.recalled_by, readAt:m.read_at,
    file: m.file_stored ? { stored:m.file_stored, name:m.file_name, size:m.file_size, mime:m.file_mime } : null
  });

  // ================= 认证 =================
  let regMode=false;
  function setAuthMode(reg){
    regMode=reg;
    el.tabLogin.classList.toggle('on',!reg);
    el.tabReg.classList.toggle('on',reg);
    el.pass2Field.classList.toggle('hidden',!reg);
    el.authTitle.textContent=reg?'注册新账号':'登录聊天室';
    el.authSub.textContent=reg?'注册后需管理员审批才能登录':'输入账号密码继续';
    el.authSubmit.textContent=reg?'提交注册':'登录';
    el.authMsg.className='msg-box';
    el.aPass.setAttribute('autocomplete',reg?'new-password':'current-password');
    el.authTip.textContent=reg?'首个注册的账号将自动成为管理员':'';
  }
  el.tabLogin.onclick=()=>setAuthMode(false);
  el.tabReg.onclick=()=>setAuthMode(true);
  el.authSubmit.onclick=doAuth;
  [el.aUser,el.aPass,el.aPass2].forEach((n)=>n.addEventListener('keydown',(e)=>{ if(e.key==='Enter') doAuth(); }));

  async function doAuth(){
    const username=el.aUser.value.trim(); const password=el.aPass.value;
    if(!username||!password) return showBox(el.authMsg,'请填写用户名和密码','err');
    const email=username+'@'+new URL(window.SUPABASE_URL).hostname;
    if(regMode){
      if(password!==el.aPass2.value) return showBox(el.authMsg,'两次输入的密码不一致','err');
      el.authSubmit.disabled=true;
      const {data:sud,error}=await sb.auth.signUp({email,password,options:{data:{username}}});
      el.authSubmit.disabled=false;
      if(error) return showBox(el.authMsg,'注册失败：'+error.message,'err');
      if(!sud.session) return showBox(el.authMsg,'注册成功！若要求邮箱验证，请在 Supabase 后台 Authentication → Providers → Email 关闭 Confirm email 后重新注册','ok');
      await boot();
    } else {
      el.authSubmit.disabled=true;
      const {error}=await sb.auth.signInWithPassword({email,password});
      el.authSubmit.disabled=false;
      if(error) return showBox(el.authMsg,'登录失败：'+error.message,'err');
      await boot();
    }
  }

  async function boot(){
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return;
    const {data:{user}}=await sb.auth.getUser();
    if(!user) return;
    const {data:u,error}=await sb.from('users').select('*').eq('id',user.id).single();
    if(error||!u) return;
    if(u.status==='pending'){ showBox(el.authMsg,'账号待管理员审批，通过后即可登录','err'); await sb.auth.signOut(); setAuthMode(false); return; }
    if(u.status==='banned'){ showBox(el.authMsg,'账号已被封禁','err'); await sb.auth.signOut(); setAuthMode(false); return; }
    me=u; perms=rolePerms(u.role); muteUntil=me.muted_until||0;
    enterApp();
  }

  function enterApp(){
    el.auth.classList.add('hidden'); el.app.classList.add('on');
    el.myName.textContent=me.username; el.myRole.textContent=ROLE_LABEL[me.role]; el.myRole.className='badge '+me.role;
    el.myAv.style.background=colorOf(me.username); el.myAv.textContent=initial(me.username);
    el.adminBtn.style.display=can('user.manage')||can('chat.delete.any')||can('report.handle')||can('dm.view')?'block':'none';
    el.newRoomBtn.style.display=can('room.create')?'inline':'none';
    if(!can('dm.send')) el.tabDms.style.display='none';
    setupRealtime();
    loadRooms();
    loadBlocks();
    loadConvs();
    refreshUnread();
  }

  el.logoutBtn.onclick=async()=>{ await sb.auth.signOut(); location.reload(); };

  // ================= 房间列表 =================
  async function loadRooms(){
    const {data,error}=await sb.from('rooms').select('*');
    if(error) return;
    rooms=data||[];
    // 首次安装且当前用户有建房间权限时，自动播种一个「大厅」公共房间
    if(rooms.length===0 && can('room.create')){
      const {error:e2}=await sb.rpc('add_room',{name:'大厅', type:'public'});
      if(!e2) return loadRooms();
    }
    renderRooms();
    if(!roomId && rooms.length) joinRoom(rooms[0].id);
  }
  function renderRooms(){
    el.roomlist.textContent='';
    rooms.forEach((room)=>{
      const d=el2('div','room'+(room.id===roomId?' on':''));
      const left=el2('span');
      left.append(document.createTextNode(room.name));
      if(room.type==='private') left.append(el2('span','lock',' 🔒'));
      const cnt=el2('span','cnt', room.id===roomId?presenceUsers.length:'');
      d.append(left,cnt);
      d.onclick=()=>joinRoom(room.id);
      el.roomlist.appendChild(d);
    });
  }

  function joinRoom(id){
    if(id===roomId) return;
    if(roomCh){ roomCh.unsubscribe(); roomCh=null; }
    roomId=id;
    const room=rooms.find((x)=>x.id===id);
    el.roomTitle.textContent=room?room.name:'—';
    el.announce.textContent=(room&&room.announce)?room.announce:'';
    el.announce.style.display=(room&&room.announce)?'block':'none';
    typingPeers.clear(); paintTyping(); renderRooms();
    if(!room) return;
    roomCh=sb.channel('room:'+id,{config:{broadcast:{self:false},presence:{key:me.id}}});
    roomCh.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+id},
      ({new:row})=>{ addMessage(normMsg(row)); });
    roomCh.on('presence',{event:'sync'},()=>{
      const st=roomCh.presenceState();
      presenceUsers=Object.values(st).flat().map((p)=>p.username).filter(Boolean);
      renderUsers(presenceUsers); renderRooms();
    });
    roomCh.on('presence',{event:'join'},({newPresences})=>{ newPresences.forEach((p)=>addSystem(`${p.username||'某人'} 加入了房间`)); });
    roomCh.on('presence',{event:'leave'},({oldPresences})=>{ oldPresences.forEach((p)=>addSystem(`${p.username||'某人'} 离开了房间`)); });
    roomCh.on('broadcast',{event:'typing'},({payload})=>{ if(payload.nick!==me.username) setTyping(payload.nick,payload.active); });
    roomCh.subscribe(async(status)=>{
      if(status==='SUBSCRIBED'){
        await roomCh.track({id:me.id,username:me.username});
        await loadRoomHistory(id);
      }
    });
  }

  async function loadRoomHistory(id){
    el.feed.textContent='';
    const {data}=await sb.from('messages').select('*').eq('room_id',id).order('ts').limit(200);
    (data||[]).map(normMsg).forEach(addMessage);
    scrollDown(true);
  }

  // ================= Realtime 初始化 =================
  async function setupRealtime(){
    const {data:{session}}=await sb.auth.getSession();
    if(session) sb.realtime.setAuth(session.access_token);
    // 私聊频道：接收发给我的广播
    dmCh=sb.channel('dm:'+me.id,{config:{broadcast:{self:false}}});
    dmCh.on('broadcast',{event:'message'},({payload})=>onDmMessage(payload));
    dmCh.on('broadcast',{event:'typing'},({payload})=>onDmTyping(payload));
    dmCh.on('broadcast',{event:'recalled'},({payload})=>{ if(payload.convKey===convKey) markDmRecalled(payload.messageId,payload.by); loadConvs(); });
    dmCh.on('broadcast',{event:'read'},()=>{ el.feed.querySelectorAll('.read-tag').forEach((t)=>{ t.className='read-tag read'; t.textContent='已读'; }); });
    dmCh.subscribe();
    sb.auth.onAuthStateChange((_e,s)=>{ if(s) sb.realtime.setAuth(s.access_token); });
  }

  function setStatus(on){
    el.dot.className='dot'+(on?'':' off');
    el.connState.textContent=on?'已连接':'已断开';
    updateSendState();
  }

  // ================= 消息渲染 =================
  const nearBottom=()=>el.feed.scrollHeight-el.feed.scrollTop-el.feed.clientHeight<120;
  const scrollDown=(f)=>{ if(f||nearBottom()) el.feed.scrollTop=el.feed.scrollHeight; };

  function addSystem(text){
    const d=el2('div','sys'); d.appendChild(el2('span',null,text));
    el.feed.appendChild(d); scrollDown();
  }
  function addMessage(m){
    if(m.id){ const ex=el.feed.querySelector(`[data-id="${m.id}"]`); if(ex) return; } // 去重（实时回显不重复渲染）
    const self=m.userId===(me&&me.id);
    const wrap=el2('div','msg'+(self?' self':'')+(m.recalled?' recalled':''));
    wrap.dataset.id=m.id;
    const av=el2('div','av',initial(m.nick)); av.style.background=colorOf(m.nick);
    const body=el2('div','body');
    const top=el2('div','top');
    top.append(el2('b',null,self?'我':m.nick),el2('span',null,timeOf(m.ts)));
    const bubble=el2('div','bubble');
    bubble.textContent=m.recalled?'消息已撤回':m.text;
    const acts=el2('div','acts');
    if(!m.recalled){
      if(self||can('chat.recall.any')){
        const b=el2('button','act','撤回');
        b.onclick=()=>recallRoomMessage(m.id);
        acts.append(b);
      }
      if(!self&&can('chat.report')){
        const b=el2('button','act','举报');
        b.onclick=()=>openReport(m); acts.append(b);
      }
      if(!self&&can('chat.delete.any')){
        const b=el2('button','act del','删除');
        b.onclick=async()=>{ if(!confirm('确定永久删除这条消息？')) return;
          await sb.rpc('delete_message',{rid:roomId,mid:m.id}); wrap.remove(); };
        acts.append(b);
      }
    }
    body.append(top,bubble,acts);
    wrap.append(av,body);
    el.feed.appendChild(wrap); scrollDown();
  }
  function recallRoomMessage(mid){
    sb.rpc('recall_message',{rid:roomId,mid}).then(()=>markRecalled(mid,'你'));
  }
  function markRecalled(messageId,by){
    const wrap=el.feed.querySelector(`[data-id="${messageId}"]`);
    if(!wrap) return;
    wrap.classList.add('recalled');
    wrap.querySelector('.bubble').textContent=`消息已被 ${by} 撤回`;
    const acts=wrap.querySelector('.acts'); if(acts) acts.textContent='';
  }
  function renderUsers(users){
    el.userlist.textContent='';
    el.onlineCnt.textContent=users.length;
    users.forEach((u)=>{
      const d=el2('div','user');
      const av=el2('div','av',initial(u)); av.style.background=colorOf(u);
      d.append(av,el2('span',null,u));
      if(me&&u===me.username) d.append(el2('span','me-tag','我'));
      el.userlist.appendChild(d);
    });
  }
  function setTyping(nick,active){
    if(typingPeers.has(nick)) clearTimeout(typingPeers.get(nick));
    if(active) typingPeers.set(nick,setTimeout(()=>{ typingPeers.delete(nick); paintTyping(); },3000));
    else typingPeers.delete(nick);
    paintTyping();
  }
  function paintTyping(){
    const names=[...typingPeers.keys()];
    el.typing.textContent=!names.length?'':names.length===1?`${names[0]} 正在输入…`:`${names.slice(0,3).join('、')} 正在输入…`;
  }
  let toastTimer=null;
  function toast(text){
    let t=$('toast');
    if(!t){ t=el2('div',null,''); t.id='toast';
      t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#232833;border:1px solid #272c37;padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 10px 30px #0008';
      document.body.appendChild(t); }
    t.textContent=text; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),3000);
  }

  // ================= 发送消息 =================
  async function sendMessage(){
    const text=el.input.value.replace(/\s+$/,'');
    if(!text||!me) return;
    if(muteUntil>Date.now()) return;
    if(mode==='dm'){ if(peer) await sendDm(text); }
    else if(roomId){
      const {data,error}=await sb.from('messages')
        .insert({room_id:roomId,user_id:me.id,nick:me.username,text,ts:Date.now()})
        .select().single();
      if(error){ toast('发送失败：'+error.message); return; }
      addMessage(normMsg(data));   // 本地立即渲染，不依赖实时回显
    }
    el.input.value=''; el.input.style.height='auto';
  }
  const autoGrow=()=>{ el.input.style.height='auto'; el.input.style.height=Math.min(el.input.scrollHeight,150)+'px'; };
  el.send.onclick=sendMessage;
  el.input.addEventListener('input',()=>{
    autoGrow();
    if(!me) return;
    const now=Date.now();
    if(mode==='dm'){
      if(!peer) return;
      if(now-lastTypingSent>1200){ dmChTo(peer.id).send({type:'broadcast',event:'typing',payload:{fromId:me.id,convKey,nick:me.username,active:true}}); lastTypingSent=now; }
      clearTimeout(dmTypingTimer);
      dmTypingTimer=setTimeout(()=>{ dmChTo(peer.id).send({type:'broadcast',event:'typing',payload:{fromId:me.id,convKey,nick:me.username,active:false}}); },1500);
    } else if(roomId&&roomCh){
      if(now-lastTypingSent>1200){ roomCh.send({type:'broadcast',event:'typing',payload:{nick:me.username,active:true}}); lastTypingSent=now; }
      clearTimeout(typingTimer);
      typingTimer=setTimeout(()=>{ roomCh.send({type:'broadcast',event:'typing',payload:{nick:me.username,active:false}}); },1500);
    }
  });
  el.input.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); sendMessage(); } });

  function updateSendState(){
    const live=!!me;
    const muted=muteUntil>Date.now();
    const blocked=mode==='dm'&&(peerBlocked||peerBlockedMe);
    if(muted){ el.muteBar.style.display='block'; el.muteBar.textContent='你已被禁言至 '+fullTime(muteUntil); }
    else el.muteBar.style.display='none';
    el.send.disabled=!live||muted||blocked;
    el.input.disabled=muted||blocked;
    if(el.attachBtn) el.attachBtn.disabled=!live||muted||blocked;
    el.input.placeholder=muted?'你已被禁言…':blocked?'无法发送消息':mode==='dm'?`发消息给 ${peer?peer.username:''}…`:'输入消息…';
  }

  // ================= 私聊 =================
  el.tabRooms.onclick=()=>setMode('room');
  el.tabDms.onclick=()=>setMode('dm');
  function setMode(m){
    mode=m;
    el.tabRooms.classList.toggle('on',m==='room');
    el.tabDms.classList.toggle('on',m==='dm');
    el.paneRooms.classList.toggle('hidden',m!=='room');
    el.paneDms.classList.toggle('hidden',m!=='dm');
    el.dmPeerState.style.display=m==='dm'?'inline':'none';
    el.peerMenuBtn.style.display=m==='dm'&&peer?'block':'none';
    el.composerHint.textContent=m==='dm'?'Enter 发送 · 私聊内容仅双方可见':'Enter 发送 · Shift+Enter 换行 · 悬停消息可撤回或举报';
    if(m==='dm'){ el.roomTitle.textContent=peer?peer.username:'私聊'; renderConvs(); renderBlocks(); loadConvs();
      if(!peer){ el.feed.textContent=''; el.feed.appendChild(el2('div','empty','从左侧选择一个会话，或点「+ 发起」开始新的私聊')); }
    } else {
      el.roomTitle.textContent=(rooms.find((r)=>r.id===roomId)||{}).name||'—';
      dmTypingPeers.clear(); paintTyping();
    }
    updateSendState();
  }

  async function loadConvs(){
    const {data,error}=await sb.rpc('get_conversations');
    if(error) return;
    convs=(data||[]).map((c)=>({convKey:c.conv_key,peerId:c.peer_id,peerName:c.peer_name,lastText:c.last_text,lastTs:c.last_ts,unread:c.unread,blocked:c.blocked,blockedMe:c.blocked_me}));
    renderConvs(); refreshUnread();
  }
  function renderConvs(){
    el.convlist.textContent='';
    if(!convs.length){ el.convlist.appendChild(el2('div','empty','暂无会话')); return; }
    convs.forEach((cv)=>{
      const d=el2('div','conv'+(cv.convKey===convKey?' on':''));
      const av=el2('div','av',initial(cv.peerName)); av.style.background=colorOf(cv.peerName);
      const info=el2('div','info');
      const nm=el2('div','nm');
      const dot=el2('span','online-dot'+(onlinePeers.has(cv.peerId)?' on':''));
      nm.append(dot,el2('span',null,cv.peerName));
      if(cv.blocked) nm.append(el2('span','read-tag','已拉黑'));
      const pv=el2('div','pv',cv.lastText||'');
      info.append(nm,pv);
      d.append(av,info);
      if(cv.unread) d.append(el2('span','unread',cv.unread>99?'99+':cv.unread));
      d.onclick=()=>openDm(cv.peerId);
      el.convlist.appendChild(d);
    });
  }
  function renderBlocks(){
    el.blocklist.textContent='';
    if(!blocks.length){ el.blocklist.appendChild(el2('div','empty','无')); return; }
    blocks.forEach((b)=>{
      const d=el2('div','conv');
      const av=el2('div','av',initial(b.user.username)); av.style.background=colorOf(b.user.username);
      const info=el2('div','info'); info.append(el2('div','nm',b.user.username));
      const btn=el2('button','act','解除');
      btn.onclick=async(e)=>{ e.stopPropagation(); await sb.rpc('toggle_block',{target:b.user.id,blocked:false}); toast('已解除拉黑'); loadBlocks(); loadConvs(); if(peer&&peer.id===b.user.id){ peerBlocked=false; updateSendState(); } };
      d.append(av,info,btn);
      el.blocklist.appendChild(d);
    });
  }
  async function loadBlocks(){

    const bubble=el2('div','bubble');
    if(m.recalled) bubble.textContent='消息已撤回';

  function buildAttach(file){
    const isImg=(file.mime||'').startsWith('image/');
    const box=el2('div','attach-card');
    const url=file.stored?sb.storage.from('attachments').getPublicUrl(file.stored).data.publicUrl:'#';
    if(isImg){ const img=document.createElement('img'); img.className='attach-img'; img.src=url; img.alt=file.name; img.onclick=()=>window.open(url,'_blank'); box.style.padding='6px'; box.appendChild(img); return box; }
    const ico=el2('div','ico',fileIcon(file.mime));
    const meta=el2('div','meta2');
    const a=document.createElement('a'); a.href=url; a.target='_blank'; a.download=file.name; a.className='nm2'; a.textContent=file.name; a.style.color='inherit';
    meta.append(a,el2('div','sz',humanSize(file.size)));
    box.append(ico,meta); return box;
  }
  function fileIcon(mime){
    if((mime||'').startsWith('image/')) return '🖼';
    if(mime==='application/pdf') return '📕';
    if((mime||'').includes('zip')) return '🗜';
    if((mime||'').includes('word')) return '📘';
    if((mime||'').includes('sheet')) return '📗';
    return '📄';
  }
  function humanSize(n){ if(n<1024) return n+' B'; if(n<1024*1024) return (n/1024).toFixed(1)+' KB'; return (n/1024/1024).toFixed(1)+' MB'; }

    if(error) return showAdmErr(error.message);
    const open=(data||[]).filter((x)=>x.status==='open').length;
    const tb=$('tabReports'); tb.innerHTML='举报处理'; if(open) tb.appendChild(el2('span','pill',open));
    const rows=(data||[]).map((x)=>{ const acts=el2('div','row-acts');
      if(x.status==='open'){ acts.append(actBtn('已处理',async()=>{ await sb.rpc('resolve_report',{rid:x.id,status:'resolved'}); renderAdmin(); }));
        acts.append(actBtn('驳回',async()=>{ await sb.rpc('resolve_report',{rid:x.id,status:'dismissed'}); renderAdmin(); },true)); }
      else acts.append(el2('span',null,`${x.handled_by||''}`));
      const content=x.message&&!x.message.recalled?(x.message.file_name?`[文件] ${x.message.file_name}`:x.message.text):'（已删除/撤回）';
      return [x.reporter_name,x.kind==='dm'?`私聊 ${x.conv_key||''}`:(x.room_name||'—'),content,x.reason||'—',
        tag({open:'待处理',resolved:'已处理',dismissed:'已驳回'}[x.status],x.status),fullTime(x.created_at),acts]; });
    el.admBody.textContent=''; el.admBody.appendChild(table(['举报人','来源','被举报内容','原因','状态','时间','操作'],rows,'暂无举报'));
  }
  async function renderAuditTab(){
    const {data,error}=await sb.rpc('admin_audit');
    if(error) return showAdmErr(error.message);
    const ACTIONS={'user.login':'登录','user.logout':'登出','user.register':'注册','user.register.first-admin':'注册（首个管理员）','user.approve':'审批通过','user.reject':'拒绝申请','user.role':'变更角色','user.status':'变更状态','user.mute':'禁言','user.unmute':'解除禁言','message.recall':'撤回消息','message.delete':'删除消息','room.create':'创建房间','room.delete':'删除房间','room.announce':'修改公告','room.member.add':'添加成员','room.member.remove':'移除成员','report.create':'提交举报','report.handle':'处理举报'};
    const rows=(data||[]).map((l)=>[fullTime(l.ts),l.actor_name,ACTIONS[l.action]||l.action,l.target||'—',l.detail||'—']);
    el.admBody.textContent=''; el.admBody.appendChild(table(['时间','操作者','操作','对象','详情'],rows,'暂无审计记录'));
  }

  async function refreshUnread(){
    const {data}=await sb.rpc('get_unread');
    unreadTotal=(data&&data.total)||0;
    el.dmBadge.textContent=unreadTotal>99?'99+':unreadTotal;
    el.dmBadge.classList.toggle('on',unreadTotal>0);
  }

  // ================= 启动 =================
  sb.auth.getSession().then(({data})=>{
    if(data.session) boot();
    else setAuthMode(false);
  });
})();

</script>
</body>
</html>
